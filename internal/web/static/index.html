<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Live temperature, humidity and air pressure from a home-built ESP32 sensor.">
  <title>Climate</title>
  <meta name="theme-color" content="#f2f5f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e161c" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/app.css">
  <link rel="modulepreload" href="/api.js">
  <link rel="modulepreload" href="/model.js">
  <link rel="modulepreload" href="/format.js">
  <link rel="modulepreload" href="/view.js">
  <link rel="modulepreload" href="/history.js">
  <link rel="modulepreload" href="/chart.js">
  <link rel="modulepreload" href="/chart-view.js">
  <link rel="modulepreload" href="/loop.js">
  <link rel="modulepreload" href="/account.js">
  <link rel="modulepreload" href="/pwa.js">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="page">
    <header class="top">
      <h1 class="brand">Climate</h1>
      <div class="account" id="account" hidden>
        <p class="role" id="role" data-role="demo"></p>
        <a class="account-button" id="sign-in" href="/api/v1/auth/telegram/login" hidden>Owner sign-in</a>
        <button type="button" class="account-button" id="sign-out" aria-disabled="false" hidden>Sign out</button>
      </div>
    </header>

    <div class="alerts" role="status">
      <p class="alert" id="alert" hidden>
        <span class="alert-mark" aria-hidden="true"></span>
        <span class="alert-text" id="alert-text"></span>
        <button type="button" class="alert-close" id="alert-close">Dismiss</button>
      </p>
    </div>

    <main class="content">
      <div class="board" id="board" data-dimmed="false" data-empty="false">
        <section class="hero" aria-labelledby="temperature-label">
          <h2 class="label" id="temperature-label"><span class="key key-temperature" aria-hidden="true"></span>Temperature</h2>
          <p class="hero-value"><span class="number" id="temperature">–</span><span class="unit">°C</span></p>
          <p class="status" id="status" role="status" data-state="loading">
            <span class="status-mark" aria-hidden="true"></span>
            <span id="status-text">Connecting to the sensor…</span>
          </p>
          <p class="subline" id="temperature-range" hidden></p>
        </section>

        <div class="side">
          <section class="tile" aria-labelledby="humidity-label">
            <h2 class="label" id="humidity-label"><span class="key key-humidity" aria-hidden="true"></span>Humidity</h2>
            <p class="value"><span class="number" id="humidity">–</span><span class="unit">%</span></p>
            <p class="subline" id="humidity-range" hidden></p>
          </section>

          <section class="tile" aria-labelledby="pressure-label">
            <h2 class="label" id="pressure-label"><span class="key key-pressure" aria-hidden="true"></span>Pressure</h2>
            <p class="value"><span class="number" id="pressure">–</span><span class="unit" id="pressure-unit">mm Hg</span></p>
            <p class="subline" id="pressure-range" hidden></p>
            <div class="units" role="group" aria-label="Pressure unit">
              <button type="button" class="unit-button" data-unit="mmhg" aria-pressed="true">mm Hg</button>
              <button type="button" class="unit-button" data-unit="hpa" aria-pressed="false">hPa</button>
            </div>
          </section>
        </div>
      </div>

      <section class="history" aria-labelledby="history-title">
        <div class="history-head">
          <h2 class="section-title" id="history-title">History</h2>
          <div class="ranges" role="group" aria-label="Time range">
            <button type="button" class="range-button" data-range="6h" aria-pressed="false">6 h</button>
            <button type="button" class="range-button" data-range="24h" aria-pressed="true">24 h</button>
            <button type="button" class="range-button" data-range="7d" aria-pressed="false">7 d</button>
            <button type="button" class="range-button" data-range="30d" aria-pressed="false">30 d</button>
          </div>
        </div>
        <p class="history-status" id="history-status" role="status" data-state="loading" hidden></p>

        <div class="charts" id="charts" data-dimmed="false">
          <figure class="chart" data-metric="temperature">
            <figcaption class="chart-head">
              <span class="label"><span class="key key-temperature" aria-hidden="true"></span>Temperature</span>
              <span class="readout" id="readout-temperature"></span>
            </figcaption>
            <svg class="plot" id="plot-temperature" role="img" tabindex="0" aria-label="Temperature"></svg>
          </figure>
          <figure class="chart" data-metric="humidity">
            <figcaption class="chart-head">
              <span class="label"><span class="key key-humidity" aria-hidden="true"></span>Humidity</span>
              <span class="readout" id="readout-humidity"></span>
            </figcaption>
            <svg class="plot" id="plot-humidity" role="img" tabindex="0" aria-label="Humidity"></svg>
          </figure>
          <figure class="chart" data-metric="pressure">
            <figcaption class="chart-head">
              <span class="label"><span class="key key-pressure" aria-hidden="true"></span>Pressure</span>
              <span class="readout" id="readout-pressure"></span>
            </figcaption>
            <svg class="plot" id="plot-pressure" role="img" tabindex="0" aria-label="Pressure"></svg>
          </figure>
        </div>

        <details class="table-view" id="table-view">
          <summary>Show the data as a table</summary>
          <div class="table-holder" id="table-holder"></div>
        </details>
      </section>
    </main>

    <noscript>
      <p class="notice">The dashboard needs JavaScript. The same data is available as JSON at <a href="/api/v1/latest">/api/v1/latest</a>.</p>
    </noscript>

    <footer class="foot">
      <p>Readings come from an ESP32-C3 with a BME280 sensor, sent over MQTT to a Go service.</p>
      <ul class="links">
        <li><a href="https://github.com/Nurs717/climate-processor" rel="noopener noreferrer">Source code</a></li>
        <li><a href="/api/v1/latest">Public API</a></li>
      </ul>
    </footer>
  </div>
</body>
</html>
