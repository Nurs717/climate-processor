<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Live temperature, humidity and air pressure from a home-built ESP32 sensor.">
  <title>Climate</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <link rel="modulepreload" href="/api.js">
  <link rel="modulepreload" href="/model.js">
  <link rel="modulepreload" href="/format.js">
  <link rel="modulepreload" href="/view.js">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="page">
    <header class="top">
      <h1 class="brand">Climate</h1>
      <p class="role" id="role" hidden></p>
    </header>

    <main class="board" id="board" data-dimmed="false">
      <section class="hero" aria-labelledby="temperature-label">
        <h2 class="label" id="temperature-label"><span class="key key-temperature" aria-hidden="true"></span>Temperature</h2>
        <p class="hero-value"><span class="number" id="temperature">–</span><span class="unit">°C</span></p>
        <p class="status" id="status" role="status" data-state="loading">
          <span class="status-mark" aria-hidden="true"></span>
          <span id="status-text">Connecting to the sensor…</span>
        </p>
      </section>

      <div class="side">
        <section class="tile" aria-labelledby="humidity-label">
          <h2 class="label" id="humidity-label"><span class="key key-humidity" aria-hidden="true"></span>Humidity</h2>
          <p class="value"><span class="number" id="humidity">–</span><span class="unit">%</span></p>
        </section>

        <section class="tile" aria-labelledby="pressure-label">
          <h2 class="label" id="pressure-label"><span class="key key-pressure" aria-hidden="true"></span>Pressure</h2>
          <p class="value"><span class="number" id="pressure">–</span><span class="unit" id="pressure-unit">mm Hg</span></p>
          <div class="units" role="group" aria-label="Pressure unit">
            <button type="button" class="unit-button" data-unit="mmhg" aria-pressed="true">mm Hg</button>
            <button type="button" class="unit-button" data-unit="hpa" aria-pressed="false">hPa</button>
          </div>
        </section>
      </div>
    </main>

    <noscript>
      <p class="notice">The dashboard needs JavaScript. The same data is available as JSON at <a href="/api/v1/latest">/api/v1/latest</a>.</p>
    </noscript>

    <footer class="foot">
      <p>Readings come from an ESP32-C3 with a BME280 sensor, sent over MQTT to a Go service.</p>
      <ul class="links">
        <li><a href="https://github.com/Nurs717/climate-processor" rel="noopener noreferrer">Source code</a></li>
        <li><a href="/api/v1/latest">Public API</a></li>
      </ul>
    </footer>
  </div>
</body>
</html>
