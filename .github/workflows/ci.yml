name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "firmware/**"
      - ".github/workflows/firmware-ci.yml"
      - "infra/**"
      - ".github/workflows/terraform-ci.yml"
  pull_request:
    paths-ignore:
      - "firmware/**"
      - ".github/workflows/firmware-ci.yml"
      - "infra/**"
      - ".github/workflows/terraform-ci.yml"

permissions:
  contents: read

# A new push to the same branch or PR cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -cover ./...
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check and test the JavaScript of the web app
        run: |
          for f in internal/web/static/*.js; do node --check "$f"; done
          node --test internal/web/jstest/*.test.js

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image (not pushed)
        run: docker build -t climate-processor:ci .

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
