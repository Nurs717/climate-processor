name: Terraform CI

# Static checks for the infrastructure code in infra/. It runs only when infra/ changes; the Go
# pipeline (ci.yml, which also triggers the deploy) ignores these paths. It never touches GCP:
# the backend is disabled, so no credentials are needed and a pull request cannot change anything.
on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-ci.yml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: infra

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          # Keep in sync with the version used locally; versions.tf requires >= 1.7.
          terraform_version: 1.7.2
      - name: Check formatting
        run: terraform fmt -check -recursive -diff
      # -backend=false: do not connect to the GCS state bucket. -lockfile=readonly: fail if the
      # committed .terraform.lock.hcl does not match the provider requirements.
      - name: Init
        run: terraform init -backend=false -lockfile=readonly
      - name: Validate
        run: terraform validate