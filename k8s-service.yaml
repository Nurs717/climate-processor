apiVersion: v1
kind: Service
metadata:
  name: climate-processor-service
spec:
  selector:
    app: climate-processor # The service will select pods with this label
  ports:
    - protocol: TCP
      port: 2112       # Port of the service itself
      targetPort: 2112 # Port inside the pod to forward traffic to
  type: NodePort       # Type that opens the port on all Minikube cluster nodes