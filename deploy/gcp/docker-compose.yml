# Cloud stack for a Google Cloud e2-micro VM (1 GB RAM): MQTT broker (TLS + passwords) + Go service.
# Prometheus/Grafana are intentionally not here - they do not fit into 1 GB.
# Usage: see README.md in this folder.

# Fixed project name: containers and volumes keep the same names wherever the stack lives.
name: climate

services:
  # One-shot helper. The broker runs as uid/gid 1883 inside its container and refuses to start if it cannot
  # read its password file or private key. Files on the VM belong to the login user, so this tiny root
  # container copies them into a named volume with the right owner and modes on every `docker compose up`.
  # Nothing on the host has to be chown-ed by hand, and `git pull` never fights over file ownership.
  mosquitto-init:
    image: alpine:3.22
    restart: "no"
    volumes:
      - ./mosquitto:/src/mosquitto:ro
      - ./certs:/src/certs:ro
      - mosquitto-config:/dst
    command:
      - sh
      - -c
      - |
        set -eu
        cp /src/mosquitto/mosquitto.conf /src/mosquitto/passwd /src/mosquitto/acl /dst/
        cp /src/certs/ca.crt /src/certs/server.crt /src/certs/server.key /dst/
        chown 1883:1883 /dst/*
        chmod 644 /dst/mosquitto.conf /dst/ca.crt /dst/server.crt
        chmod 600 /dst/passwd /dst/acl /dst/server.key

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
    ports:
      - "8883:8883" # MQTT over TLS, the only port exposed to the internet
    volumes:
      - mosquitto-config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  climate-app:
    # The image is built and pushed by the CD pipeline; scripts/deploy.sh writes this variable into .env.
    image: ${CLIMATE_APP_IMAGE:?set CLIMATE_APP_IMAGE in .env (scripts/deploy.sh does it)}
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      MQTT_BROKER_URL: ssl://mosquitto:8883
      MQTT_USERNAME: climate
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in .env}
      MQTT_CA_FILE: /certs/ca.crt
      MQTT_TLS_SERVER_NAME: mqtt.climate.local # must match the certificate SAN (see scripts/gen-secrets.sh)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_IDS: ${TELEGRAM_ADMIN_CHAT_IDS:-}
      ACCESS_FILE: /data/access.json # users approved in the bot; the volume keeps them across deployments
      TIMEZONE: Asia/Almaty
      STALE_AFTER: 5m
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - climate-data:/data
    ports:
      - "127.0.0.1:2112:2112" # metrics/healthz only on the VM itself (reach it via an SSH tunnel)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mosquitto-config:
  mosquitto-data:
  climate-data:
