# Local development stack: broker + service + Prometheus + Grafana, nothing to configure.
# Start it with `make up` from the repository root. Everything listens on localhost only.

name: climate-local

services:
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "127.0.0.1:1883:1883" # plain MQTT for local tests (no TLS, no passwords)

  climate-app:
    build:
      context: ../.. # project root
    depends_on:
      - mosquitto
    environment:
      MQTT_BROKER_URL: tcp://mosquitto:1883
      # The Telegram bot stays disabled until you create deploy/local/.env (see .env.example).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_IDS: ${TELEGRAM_ADMIN_CHAT_IDS:-}
      ACCESS_FILE: /data/access.json
      DB_PATH: /data/climate.db # reading history; the climate-data volume keeps it across deployments
      LOG_FORMAT: text # readable lines for local development (JSON in the cloud)
      TIMEZONE: Asia/Almaty
      STALE_AFTER: 5m
    volumes:
      - climate-data:/data # users approved in the bot survive `make down` / `make up`
    ports:
      - "127.0.0.1:2112:2112" # /metrics and /healthz

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - climate-app

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin # local only: the port is bound to localhost
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/climate.json
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  climate-data:
